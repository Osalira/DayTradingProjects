# version: '3.8'

# Define all services that make up the SENG 468 day trading system
services:
  # API Gateway service - Entry point for all client requests
  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    expose:
      - "5000"  # Only expose to internal network, not to host
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5000
      - TRADING_SERVICE_URL=http://trading-service:8000
      - MATCHING_ENGINE_URL=http://matching-engine:8080
      - LOGGING_SERVICE_URL=http://logging-service:5000
      - FLASK_ENV=production
      - SECRET_KEY=${API_GATEWAY_SECRET_KEY:-default_secret_key}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - PYTHONUNBUFFERED=1
      # RabbitMQ settings
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      # Rate limiting
      - RATE_LIMIT_ENABLED=True
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_WINDOW=60

      # Circuit breaker
      - CIRCUIT_BREAKER_ENABLED=True
      - CIRCUIT_BREAKER_THRESHOLD=10
      - CIRCUIT_BREAKER_TIMEOUT=120

      # Request timeout
      - REQUEST_TIMEOUT=120
      - REGISTRATION_TIMEOUT=600

      # Logging
      - LOG_LEVEL=DEBUG
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - auth-service
      - trading-service
      - matching-engine
      - logging-service
      - rabbitmq
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3  # Run 3 instances of the API Gateway
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Load Balancer for API Gateway
  nginx-lb:
    image: nginx:latest
    ports:
      - "127.0.0.1:8001:8090"  # IPv4 binding
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - trading-network
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0  # Enable IPv6 in container
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Authentication service - Handles user authentication and authorization
  auth-service:
    build: 
      context: ./auth-service
      dockerfile: Dockerfile
    expose:
      - "5000"  # Only expose to internal network, not to host
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@auth_db:5432/auth_db
      - FLASK_ENV=production
      - SECRET_KEY=${AUTH_SERVICE_SECRET_KEY:-default_secret_key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-daytrading_jwt_secret_key_2024}
      # RabbitMQ settings
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      # DB Connection Pool Settings
      - DB_POOL_SIZE=200
      - DB_MAX_OVERFLOW=500
      - DB_POOL_TIMEOUT=60
      - DB_POOL_RECYCLE=1800
      # Gunicorn settings for higher performance
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=8
      - GUNICORN_TIMEOUT=600
      - GUNICORN_KEEPALIVE=5
      - GUNICORN_MAX_REQUESTS=10000
      - GUNICORN_MAX_REQUESTS_JITTER=1000
    depends_on:
      - auth_db
      - rabbitmq
    networks:
      - trading-network
    restart: unless-stopped
    volumes:
      - auth-logs:/app/logs
      - ./auth-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3  # Increased from 1 to 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Dedicated DB for auth-service
  auth_db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=auth_db
      # This sets the authentication method for PostgreSQL
      - POSTGRES_INITDB_ARGS=--auth=md5
    ports:
      - "127.0.0.1:60020:5432"
    networks:
      - trading-network
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    command: postgres -c max_connections=1000 -c shared_buffers=2GB -c effective_cache_size=3GB -c work_mem=16MB -c maintenance_work_mem=256MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Trading service - Handles trading operations and business logic
  trading-service:
    build: 
      context: ./trading-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:60030:8000"
    environment:
      - DB_NAME=trading_db
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=trading_service_project.settings
      - DJANGO_SECRET_KEY=${TRADING_SERVICE_SECRET_KEY:-default_secret_key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-daytrading_jwt_secret_key_2024}
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=trading-service,localhost,127.0.0.1
      - PYTHONUNBUFFERED=1
      # RabbitMQ settings
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      # Connection pool settings
      - DB_MAX_CONNECTIONS=100
      - DB_CONN_MAX_AGE=60
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - db
      - rabbitmq
    networks:
      - trading-network
    restart: unless-stopped
    volumes:
      - trading-logs:/app/logs
      - trading-static:/app/staticfiles
      - ./trading-service:/app
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Matching Engine service - Handles order matching logic
  matching-engine:
    build: 
      context: ./matching-engine
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:60040:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_NAME=matching_db
      - TRADING_SERVICE_URL=http://api-gateway:5000/transaction/processTransaction
      - SERVICE_AUTH_TOKEN=${SERVICE_AUTH_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOjE3NDE1OTYxNjQsInN1YiI6eyJpZCI6OTk5LCJ1c2VybmFtZSI6InN5c3RlbSIsImFjY291bnRfdHlwZSI6InN5c3RlbSJ9fQ.lUfb-sWxDiV0VpXI31sdcLrt1sZxZ5AiRLakHOop5fw}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-daytrading_jwt_secret_key_2024}
      - PORT=8080
      # RabbitMQ settings
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      # Connection pool settings
      - DB_MAX_CONNECTIONS=100
      - DB_MIN_CONNECTIONS=10
      - DB_CONNECTION_TIMEOUT=60000
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped
    volumes:
      - matching-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Logging service - Handles system-wide logging and auditing
  logging-service:
    build: 
      context: ./logging-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:60050:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/logging_db
      - FLASK_ENV=production
      - SECRET_KEY=${LOGGING_SERVICE_SECRET_KEY:-default_secret_key}
      # RabbitMQ settings
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      # DB Connection Pool Settings
      - DB_POOL_SIZE=50
      - DB_MAX_OVERFLOW=100
      - DB_POOL_TIMEOUT=60
    depends_on:
      - db
      - rabbitmq
    networks:
      - trading-network
    restart: unless-stopped
    volumes:
      - logging-logs:/app/logs
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:60060:5672"  # AMQP protocol port
      - "127.0.0.1:60070:15672"  # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
      # Performance tuning parameters
      # - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.8
      - RABBITMQ_DISK_FREE_LIMIT=2GB
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit tcp_listeners [{"0.0.0.0",5672}] -rabbit heartbeat 120 -rabbit tcp_listen_options [binary,{packet,raw},{reuseaddr,true},{backlog,4096},{nodelay,true},{linger,{true,0}},{exit_on_close,false},{keepalive,true}]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # PostgreSQL Database (for non-auth services)
  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_MULTIPLE_DATABASES=trading_db,matching_db,logging_db
      # This sets the authentication method for PostgreSQL
      - POSTGRES_INITDB_ARGS=--auth=md5
      # Optimize PostgreSQL for high concurrency
      - POSTGRES_SHARED_BUFFERS=1GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=3GB
      - POSTGRES_WORK_MEM=16MB
      - POSTGRES_MAINTENANCE_WORK_MEM=256MB
      - POSTGRES_MAX_CONNECTIONS=500
    ports:
      - "127.0.0.1:60080:5432"
    networks:
      - trading-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the initialization script
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis for caching, session storage, and messaging
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:60090:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --tcp-backlog 511 --appendonly yes --io-threads 4
    networks:
      - trading-network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Cross-platform proxy for reliable host access to API Gateway
  api-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:7000:80"  # IPv4 binding for host access
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - trading-network
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0  # Enable IPv6 in container
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Add host machine access

# Define networks
networks:
  trading-network:
    driver: bridge

# Define volumes
volumes:
  postgres_data:
  auth_postgres_data:
  redis_data:
  rabbitmq_data:
  auth-logs:
  trading-logs:
  trading-static:
  matching-logs:
  logging-logs: 