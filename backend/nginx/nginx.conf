worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimize for high throughput
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 10000;
    
    # Increase buffer sizes for high load
    client_body_buffer_size 256k;
    client_max_body_size 20m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    output_buffers 1 64k;
    postpone_output 1460;
    
    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Define upstream servers (API Gateway instances)
    upstream api_gateway {
        least_conn;
        server api-gateway:5000 max_fails=3 fail_timeout=30s;
        keepalive 100;
    }
    
    # Define upstream servers for the auth-service
    upstream auth_service {
        least_conn;
        server auth-service:5000 max_fails=3 fail_timeout=30s;
        keepalive 100;
    }
    
    # Main server configuration
    server {
        # IPv4 binding
        listen 8090 default_server;
        
        # # IPv6 binding
        # listen [::]:8090 default_server ipv6only=on;
        
        server_name _;
        # Bind only to IPv4 on port 8001
        # this
        # listen 0.0.0.0:8090 default_server;
        # Optionally, if you still want to bind to IPv6, you can add a conditional redirect:
        # listen [::]:8001 default_server ipv6only=on;
        # this
        # server_name localhost;

        # If a request comes from IPv6 localhost (::1), redirect it to 127.0.0.1
        # this
        # if ($remote_addr = "0:0:0:0:0:0:0:1") {
        #     return 301 http://127.0.0.1$request_uri;
        # }
        
        # Timeouts
        client_body_timeout 300;
        client_header_timeout 300;
        send_timeout 300;
        
        # Default proxy location
        location / {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
        }
        
        # Special location for registration with extended timeouts
        location /authentication/register {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            proxy_buffer_size 512k;
            proxy_buffers 16 512k;
            proxy_busy_buffers_size 1024k;
            proxy_buffering off;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://api_gateway/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}