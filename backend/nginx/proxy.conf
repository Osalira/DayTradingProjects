server {
    listen 80 default_server;
    # listen 80 default_server ipv6only=off;  # IPv4
    # listen [::]:80 default_server ipv6only=on;  # IPv6
    server_name _;
    
    # Increase timeouts for long-running requests
    # Use integer values for timeouts (remove 's' suffix)
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    
    # Buffer settings for better performance
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Disable caching specifically for API endpoints
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    
    # Keepalive settings
    keepalive_timeout 65;
    keepalive_requests 100;
    
    location / {
        # DNS resolver settings for better reliability
        resolver 127.0.0.11 valid=30s;
        set $upstream api-gateway;
        
        proxy_pass http://$upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Enable keepalive connections
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important WSL2 compatibility setting
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer settings for large requests
        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_buffering off;
    }
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
    
    # Custom error handling
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Custom logging
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log warn;
} 